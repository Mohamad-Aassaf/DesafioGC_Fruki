spring.application.name=fruki-api
server.port=8080

# Banco H2 em arquivo: os dados ingeridos continuam lá depois de reiniciar a API.
spring.datasource.url=jdbc:h2:file:./dados/fruki
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do banco: http://localhost:8080/h2  (JDBC URL acima, usuário sa, sem senha)
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Fonte do clima: "simulado" (padrão, funciona offline) ou "open-meteo" (previsão real;
# se a chamada falhar, a API usa a estimativa simulada e avisa na resposta).
fruki.clima.fonte=simulado
fruki.clima.timeout-ms=3000

# Quantos dias de compras contam como histórico do cliente.
fruki.historico.janela-dias=180
